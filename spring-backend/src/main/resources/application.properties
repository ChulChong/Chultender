spring.application.name=chultender-backend
server.port=8080

# Session pooler connection to the same Supabase Postgres database the
# React app's Supabase client already reads/writes. Supabase's direct
# connection (db.<ref>.supabase.co) is IPv6-only unless you pay for the
# dedicated IPv4 add-on; the session pooler is IPv4-reachable and is what
# lets this run from hosts without outbound IPv6 (e.g. an Oracle Cloud
# free-tier VM). The password lives in application-local.properties
# (gitignored) — see README.md in this folder.
spring.datasource.url=jdbc:postgresql://aws-0-us-east-2.pooler.supabase.com:5432/postgres
spring.datasource.username=postgres.taeebfkfvarjuxdmoglt
spring.datasource.driver-class-name=org.postgresql.Driver

# Tables already exist (created from the Supabase SQL editor) — never let
# Hibernate create/alter/drop them.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# Loads application-local.properties automatically (Spring Boot's
# profile-specific file convention) — that's where the DB password lives.
spring.profiles.active=local
