spring.application.name=chultender-backend
server.port=8080

# Direct (non-pooled) connection to the same Supabase Postgres database the
# React app's Supabase client already reads/writes. The password lives in
# application-local.properties (gitignored) — see README.md in this folder.
spring.datasource.url=jdbc:postgresql://db.taeebfkfvarjuxdmoglt.supabase.co:5432/postgres
spring.datasource.username=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# Tables already exist (created from the Supabase SQL editor) — never let
# Hibernate create/alter/drop them.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# Loads application-local.properties automatically (Spring Boot's
# profile-specific file convention) — that's where the DB password lives.
spring.profiles.active=local
